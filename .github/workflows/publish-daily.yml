THE DAILY WHAT THE HELL? — FREE AUTOMATIC WEBSITE PUBLISHING

This is a separate source-linked feed edition of the newspaper, NOT an automatic
copy of the ChatGPT-written 9:00 a.m. edition. It retains the exact approved
masthead, tropical story-card design, both-island weather, the two genuine
Azores travel photos, food, events-calendar links, Apocalypse Update,
Jay's Corner, and horoscopes. It uses no paid API.

SETUP (one time)
1. In the GitHub repository root, upload daily_publisher.py.
2. On GitHub, Add file > Create new file. Name it:
     .github/workflows/publish-daily.yml
   Paste the contents of publish-daily.yml and commit it.
3. Repository Settings > Pages > Build and deployment > Source:
   switch from 'Deploy from a branch' to 'GitHub Actions'.
4. Open the Actions tab > Publish The Daily What the Hell > Run workflow.
5. Wait for the green check, then open the permanent public website URL.

AUTOMATIC SCHEDULE
The GitHub workflow is scheduled for 08:15 HST (18:15 UTC) daily so it
usually finishes before 09:00 HST. GitHub scheduled Actions can run late
and are not guaranteed to start at the exact minute.

SAFETY/TRANSPARENCY
- Requires at least 5 recent dated publisher feed headlines; otherwise it
  fails without replacing the previously published website edition.
- Weather comes from Open-Meteo model forecasts; official NWS alerts are
  linked and checked separately. If a source is unavailable, the page says so.
- The Azores travel spotlight is an evergreen feature until its content is
  deliberately refreshed; do not mistake it for a daily-changing destination.
- Big Island event calendars are linked, but no unverified event times are
  invented.
- The 9 a.m. ChatGPT newspaper notification is a separate automation.
- Public GitHub Pages hosting and public-repo Actions require no paid plan.
