name: Publish The Daily What the Hell

on:
  schedule:
    # 08:15 Hawaii Standard Time (UTC-10); allows time to publish before 09:00.
    # GitHub's scheduled runs can be delayed and are not guaranteed exact.
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out approved newspaper template
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate today's source-linked edition
        run: python daily_publisher.py --template index.html --output public/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish to permanent link
        id: deployment
        uses: actions/deploy-pages@v4
